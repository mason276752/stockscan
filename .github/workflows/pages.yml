# Publish the pure-frontend build (web/dist-static) to GitHub Pages on every
# push to main. Needs: Settings → Pages → Source = "GitHub Actions", and a
# repository secret SEC_USER_AGENT ("Name email") - the build fetches the
# ticker table, the SIC / filer universe and ETF lists from SEC; the market
# snapshot comes from TradingView. The filings themselves are in the repo.
name: Deploy static site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm --prefix web ci
      - run: npm run build:static
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          STOCKSCAN_CRAWL: '0'
          IB_ENABLED: '0'
          TV_ENABLED: '0'
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist-static

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
