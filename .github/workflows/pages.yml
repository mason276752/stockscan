# Publish the pure-frontend build (web/dist-static) to GitHub Pages:
#   - on every push to main (code only: the data comes from the data ref)
#   - on a schedule around the hours filings land on EDGAR: first the day's new
#     10-K / 10-Q / 20-F / 40-F are fetched, parsed, scored and pushed to the
#     data ref, then the site is rebuilt with them
#   - by hand (Actions → Run workflow)
# Data lives on the ref refs/data/main, never on main: data/store (filings,
# scores, filing lists) and data/bars (the finished years of daily bars).
# Outside refs/heads/ so that a plain `git clone` does not download it
# (600 MB) - only `git fetch origin refs/data/main` does (scripts/
# pull-data.sh). Here it is fetched into data-repo/ and the tools are
# pointed at it with STOCKSCAN_STORE / STOCKSCAN_BARS. After a scheduled
# fetch the new files go up as one more commit on that ref. (A commit's
# parent is what makes the push small: git only sends what the parent
# lacks. An orphan commit, or a rewritten ref, would resend all 600 MB.)
# This year's bars (head.zst, not in git) are fetched from TradingView here
# before the build and kept between runs in the Actions cache.
# Needs: Settings → Pages → Source = "GitHub Actions". SEC_USER_AGENT ("Name
# email") comes from the repository secret of that name, else the default
# below - the build fetches the ticker table, the SIC / filer universe and ETF
# lists from SEC (falling back to the copies in data/store); the market
# snapshot comes from TradingView.
name: Deploy static site to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    # cron is UTC. New York is UTC-4 in summer (EDT, second Sunday of March to
    # the first Sunday of November) and UTC-5 in winter (EST), so each time
    # below is written for one clock and drifts an hour under the other.
    #
    # Filings - EDGAR accepts them 06:00-22:00 ET; most 10-Q / 10-K arrive
    # right after the 16:00 close and in the morning before the open:
    - cron: '30 12 * * 1-5' # 08:30 EDT / 07:30 EST - the morning's filings
    - cron: '45 21 * * 1-5' # 17:45 EDT / 16:45 EST - right after the 16:00 close (and the day's bars: the 16:00 bar is final)
    - cron: '30 2 * * 2-6'  # 22:30 EDT / 21:30 EST - the end of EDGAR's day (UTC: the next day)
    #
    # Daily bars - from December the US session runs 23 hours (20:00 ET to
    # 19:00 ET the next day, closed 19:00-20:00). The day's bar is final only
    # in that hour, so a run must land in it whichever clock is in force:
    - cron: '30 23 * * 1-5' # 19:30 EDT - in the pause (18:30 EST: too early, the next one covers winter)
    - cron: '30 0 * * 2-6'  # 19:30 EST - in the pause (20:30 EDT: the next session has opened; yesterday's bar is final anyway)
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT || 'Mason mason276752@gmail.com' }}
      STOCKSCAN_STORE: ${{ github.workspace }}/data-repo/data/store
      STOCKSCAN_BARS: ${{ github.workspace }}/data-repo/data/bars
      STOCKSCAN_CRAWL: '0'
      IB_ENABLED: '0'
      TV_ENABLED: '0'
    steps:
      - uses: actions/checkout@v4
      # the data ref, beside the code (tip only; the token lets the step
      # further down push a new commit to it)
      - name: Fetch the data ref
        run: |
          git init -q data-repo
          cd data-repo
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git fetch -q --depth=1 --no-tags origin refs/data/main
          git checkout -q FETCH_HEAD
          echo "data ref $(git rev-parse --short HEAD): $(git log -1 --format=%s)"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm --prefix web ci

      # scheduled / manual runs: top the store up with the newest filings
      - name: Fetch new filings from EDGAR
        if: github.event_name != 'push'
        run: npm run fetch:new

      # this year's bars (head.zst of every symbol): restored from the last
      # run's cache, topped up from TradingView on scheduled / manual runs
      # (one request per symbol, ~12 min the first time after a close, a
      # minute when they are already fresh), saved for the next run. A push
      # only rebuilds with the bars the last such run left in the cache. A
      # cache key is immutable, so it carries the run id; restore-keys picks
      # the newest previous one.
      - name: Restore this year's bars
        uses: actions/cache@v4
        with:
          path: data-repo/data/bars/**/head.zst
          key: bars-head-${{ github.run_id }}
          restore-keys: bars-head-
      - name: Fetch this year's bars from TradingView
        if: github.event_name != 'push'
        run: npm run fetch:bars
        continue-on-error: true
        env:
          STOCKSCAN_BARS_CRAWL_PARALLEL: '8'

      # the store as it is now, as one more commit on the data ref
      # (head.zst and .tmp files are ignored by the ref's .gitignore).
      # Nothing changed: nothing pushed. A crossing of a year boundary (a
      # new <year>.zst) lands here the same way.
      - name: Push the data ref
        if: github.event_name != 'push'
        working-directory: data-repo
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "no data changes"
          else
            git config user.name 'github-actions[bot]'
            git config user.email 'github-actions[bot]@users.noreply.github.com'
            git commit -q -m "data: $(date -u +%Y-%m-%d) [ci]"
            git push -q origin HEAD:refs/data/main
            echo "pushed $(git rev-parse --short HEAD)"
          fi

      # the Rust helper the build uses for its heavy parts (tools/stockscan-static);
      # cached between runs, so this is seconds unless the crate changed
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tools/stockscan-static
      - run: cargo build --release --manifest-path tools/stockscan-static/Cargo.toml

      # --link: the store goes into the site as hard links (same filesystem)
      - name: Build the static site
        run: node server/tools/build-static.mjs --link
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist-static

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
